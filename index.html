<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--seo-head-->
    <!-- the static pre-render below is for crawlers and no-JS readers; the app replaces it -->
    <script>document.documentElement.classList.add('js')</script>
    <style>
      .js .ssg { display: none }
      .ssg { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem; color: #ecebe6; background: #000; font: 15px/1.6 ui-monospace, monospace }
      .ssg img { max-width: 240px; height: auto }
      .ssg a { color: #ff2a1f }
    </style>
    <!-- the hero's first frames: start fetching before the JS boots -->
    <link rel="preload" as="image" href="/img/hero_away.webp" type="image/webp" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/img/hero_eye.webp" type="image/webp" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,400;1,500&family=Unbounded:wght@300;500;700;900&display=swap" rel="stylesheet" />
  </head>
  <body style="background:#000">
    <div id="root"><!--ssg--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
